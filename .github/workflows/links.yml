# Control de enlaces caídos: una vez por semana revisa todos los enlaces externos de libro/, los
# textos largos en español de docs/ y el README, y deja el resultado en el resumen (Summary) de la
# ejecución. Solo informa (el script siempre sale con 0), así que el workflow queda siempre en verde:
# hay que entrar a ver el resultado.
# «Caídos seguro» (404, 410, DOI inexistente) son los que hay que arreglar; «no conectó» suele ser
# un sitio que bloquea servidores de otros países, y vale la pena mirarlo solo si se repite varias
# semanas; «TLS incompatible» son sitios con cifrado viejo que el navegador igual abre.
# No va en book.yml: que cientos de sitios externos respondan o no no depende de los cambios al texto.
name: Enlaces caídos

on:
  schedule:
    - cron: '0 11 * * 1'   # lunes 8:00 de Buenos Aires
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Enlaces caídos
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-links.mjs
