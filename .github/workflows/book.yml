# Cada vez que cambia el texto se regeneran las tres descargas y se suben al release fijo
# «epub-latest», así los enlaces no cambian:
#   EPUB          https://github.com/javierdac/VivirMejorAR/releases/download/epub-latest/VivirMejorAR.epub
#   PDF           https://github.com/javierdac/VivirMejorAR/releases/download/epub-latest/VivirMejorAR.pdf
#   HTML offline  https://github.com/javierdac/VivirMejorAR/releases/download/epub-latest/VivirMejorAR.html
# En los PR solo se generan y validan (quedan como artifact en la página de Actions), no se publican.
name: Libro electrónico

on:
  push:
    branches: [main]
    paths:
      - README.md
      - index.html
      - libro/**
      - docs/*.md
      - tools/**
      - .github/workflows/book.yml
  pull_request:
    paths:
      - README.md
      - index.html
      - libro/**
      - docs/*.md
      - tools/**
      - .github/workflows/book.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: book-${{ github.ref }}
  cancel-in-progress: true

env:
  PANDOC_VERSION: '3.11'
  TYPST_VERSION: '0.15.1'

jobs:
  # Referencias cruzadas. Job aparte, fuera de build: una referencia sin ancla no tiene por qué
  # frenar la publicación del EPUB, el PDF y el HTML. En los PR se ve en rojo igual. Sin dependencias.
  refs:
    name: Referencias cruzadas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-refs.mjs --check

  # Líneas «En simple»: largo, jerga estadística y frases vacías. Aparte, por lo mismo.
  plain:
    name: Control de «En simple»
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-plain.mjs

  # Estadísticas: que los números de README e index.html coincidan con libro/. Solo compara:
  # si CI empujara commits a main se separaría de las copias locales.
  stats:
    name: Estadísticas al día
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/sync-stats.mjs --check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/epub/package-lock.json

      - run: npm ci
        working-directory: tools/epub

      - name: EPUB
        run: node tools/epub/build.mjs

      - name: HTML offline
        run: node tools/offline/build.mjs

      # El texto es latino (typst trae Libertinus); fonts-noto-cjk queda como respaldo barato para
      # los nombres de archivo en chino que aparecen en los capítulos pendientes.
      - name: Instalar pandoc, typst y fuentes
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          curl -sSL "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz" | tar xz
          curl -sSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" | tar xJ
          echo "$PWD/pandoc-${PANDOC_VERSION}/bin" >> "$GITHUB_PATH"
          echo "$PWD/typst-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"

      - name: PDF
        run: node tools/pdf/build.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: epubcheck
        run: |
          curl -sSL -o epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip
          unzip -q epubcheck.zip
          java -jar epubcheck-5.4.0/epubcheck.jar dist/VivirMejorAR.epub

      - uses: actions/upload-artifact@v4
        with:
          name: VivirMejorAR
          path: |
            dist/VivirMejorAR.epub
            dist/VivirMejorAR.pdf
            dist/VivirMejorAR.html

      - name: Publicar en el release epub-latest
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f epub-latest
          git push -f origin epub-latest
          notes="Commit ${GITHUB_SHA::7}, generado el $(TZ=America/Argentina/Buenos_Aires date +'%Y-%m-%d %H:%M') (hora de Buenos Aires). EPUB, PDF y HTML offline; se regeneran solos cada vez que cambia el texto y los enlaces de descarga no cambian. Adaptación modificada de «高性价比人生指南» (eternity4719, https://github.com/eternity4719/HowToLiveBetter), CC BY 4.0."
          if gh release view epub-latest >/dev/null 2>&1; then
            gh release edit epub-latest --title "Libro electrónico (EPUB / PDF / HTML offline, se actualiza solo)" --notes "$notes"
          else
            gh release create epub-latest --title "Libro electrónico (EPUB / PDF / HTML offline, se actualiza solo)" --notes "$notes" --latest=false
          fi
          gh release upload epub-latest \
            dist/VivirMejorAR.epub \
            dist/VivirMejorAR.pdf \
            dist/VivirMejorAR.html --clobber
